# One command runs everything locally:  cp .env.example .env  &&  docker compose up --build
# Web app: http://localhost:4200   API + Swagger: http://localhost:5080/swagger
name: tenant-manager

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__Default: "Server=sqlserver,1433;Database=TenantManager;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (copy .env.example)}
  Seed__DemoData: "true"
  Seed__Password: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env (copy .env.example)}
  Database__MigrateOnStartup: "false"
  ReverseProxy__Enabled: "true"
  # Documents go to Azurite, the Azure Blob emulator. The account key below is Azurite's public,
  # documented development key, not a secret. Switching to real Azure Storage is a config change.
  Storage__Provider: AzureBlob
  Storage__Container: documents
  Storage__AzureConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
  # WhatsApp: the fake provider unless you set the Meta values in .env (see README, "WhatsApp").
  WhatsApp__Provider: ${WHATSAPP_PROVIDER:-Fake}
  WhatsApp__AppSecret: ${WHATSAPP_APP_SECRET:-}
  WhatsApp__VerifyToken: ${WHATSAPP_VERIFY_TOKEN:-}
  WhatsApp__AccessToken: ${WHATSAPP_ACCESS_TOKEN:-}
  WhatsApp__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:-}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env (copy .env.example)}
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Azure Blob emulator: stores lease PDFs (and, from Phase 3, proof of payment).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]
    volumes: [blobdata:/data]

  # Applies migrations and loads synthetic demo data, then exits.
  migrator:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: tenant-manager-api:local
    command: ["migrate"]
    environment:
      <<: *api-env
      Jobs__Enabled: "false"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
    restart: "no"

  api:
    image: tenant-manager-api:local
    pull_policy: never
    environment:
      <<: *api-env
      # Hangfire runs the daily lease checks at 00:15 South African time.
      Jobs__Enabled: "true"
    ports: ["5080:8080"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports: ["4200:8080"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  sqldata:
  blobdata:
