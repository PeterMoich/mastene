# Weekly dependency updates, grouped so they arrive as a few reviewable PRs. CI (tests, CodeQL,
# vulnerable-package and npm audit checks) runs on each before anything can be merged.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      microsoft: { patterns: ["Microsoft.*", "System.*"] }
      opentelemetry: { patterns: ["OpenTelemetry*", "Azure.Monitor.*"] }
      other: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"] }
      other: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }
