name: infra
# Creates or updates every Azure resource from infra/main.bicep (ADR-0017). Run by hand.
# Needs the same OIDC secrets and vars as deploy.yml, plus secrets SQL_ADMIN_PASSWORD, JWT_SIGNING_KEY
# and (for the demo data) SEED_PASSWORD; optional ALERT_EMAIL var.
on:
  workflow_dispatch:
    inputs:
      what_if:
        description: Only show what would change
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Remove what the demo profile doesn't use (Azure keeps resources a template stops mentioning)
        if: ${{ !inputs.what_if }}
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          profile=$(jq -r '.parameters.costProfile.value // "demo"' infra/main.parameters.json)
          echo "Cost profile: $profile"
          [ "$profile" = "demo" ] || exit 0
          for site in $(az webapp list -g "$RG" --query "[].name" -o tsv); do
            if az webapp deployment slot list -g "$RG" -n "$site" --query "[?name=='staging'] | length(@)" -o tsv | grep -q '^1$'; then
              echo "Deleting the staging slot of $site (the Basic plan has no slots)"
              az webapp deployment slot delete -g "$RG" -n "$site" --slot staging
            fi
            uri="/subscriptions/$(az account show --query id -o tsv)/resourceGroups/$RG/providers/Microsoft.Web/sites/$site/sitecontainers/clamav?api-version=2024-04-01"
            if az rest --method get --uri "$uri" > /dev/null 2>&1; then
              echo "Removing the ClamAV sidecar from $site (uploads use the built-in EICAR check in demo)"
              az rest --method delete --uri "$uri"
            fi
          done

      - name: Deploy infra/main.bicep
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          mode=create; [ "${{ inputs.what_if }}" = "true" ] && mode=what-if
          az deployment group $mode -g "$RG" -f infra/main.bicep -p infra/main.parameters.json \
            -p sqlAdminPassword="$SQL_ADMIN_PASSWORD" jwtSigningKey="$JWT_SIGNING_KEY" \
               seedPassword="$SEED_PASSWORD" alertEmail="$ALERT_EMAIL"
