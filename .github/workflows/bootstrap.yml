name: bootstrap
# Temporary: scaffolds the solution with the official CLIs and commits the result back
# to the bootstrap branch. Deleted once main has the real code.
on:
  push:
    branches: [bootstrap]
permissions:
  contents: write
jobs:
  scaffold:
    if: "!contains(github.event.head_commit.message, '[scaffolded]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scaffold
        run: bash tools/bootstrap.sh
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: scaffold solution and Angular app [scaffolded]"
          git push
