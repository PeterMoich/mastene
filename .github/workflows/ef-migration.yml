name: ef-migration
# Generates an EF Core migration on GitHub's runners, for contributors without the .NET SDK.
# Push a branch named tooling/<anything> whose last commit message contains
# [gen-migration:<Name>]; the workflow builds, runs `dotnet ef migrations add <Name>` and
# commits the generated files back to that branch for review.
on:
  push:
    branches: ['tooling/**']
permissions:
  contents: write
jobs:
  migration:
    if: contains(github.event.head_commit.message, '[gen-migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        timeout-minutes: 15
        # Log to a file, not a pipe: build-server processes outlive the build and would keep a pipe open.
        run: |
          rc=0; dotnet build TenantManager.slnx --disable-build-servers -clp:NoSummary > build.log 2>&1 || rc=$?
          cat build.log; exit $rc
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E ": (error|warning) [A-Z]+[0-9]+" build.log | sed -E 's/ \[[^]]*\]$//; s#^.*/mastene/##' | sort -u | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=build::$msg"
      - name: Generate migration
        timeout-minutes: 10
        run: |
          dotnet tool restore
          name=$(git log -1 --pretty=%s | sed -nE 's/.*\[gen-migration:([A-Za-z0-9]+)\].*/\1/p')
          rc=0; dotnet ef migrations add "${name:-InitialCreate}" -p src/TenantManager.Infrastructure -s src/TenantManager.Api -o Persistence/Migrations --no-build > ef.log 2>&1 || rc=$?
          cat ef.log; exit $rc
      - name: Report migration errors
        if: failure()
        run: |
          msg=$(tail -40 ef.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=ef::$msg"
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TenantManager.Infrastructure/Persistence/Migrations
          git commit -m "chore: generate EF Core migration [skip ci]"
          git push
