name: ci

on:
  push:
    branches: [master, 'phase-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Logs go to files, not pipes: .NET build-server processes outlive the build and would hold a pipe open.
      - name: Build (warnings are errors; NuGet vulnerability audit included)
        run: |
          rc=0; dotnet build TenantManager.slnx -c Release --disable-build-servers -clp:NoSummary > build.log 2>&1 || rc=$?
          cat build.log
          if [ $rc -ne 0 ]; then python3 .github/scripts/annotate.py build build.log; fi
          exit $rc

      - name: Check for vulnerable packages (including transitive)
        run: |
          dotnet list TenantManager.slnx package --vulnerable --include-transitive > vuln.txt 2>&1 || true
          cat vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error title=Vulnerable packages::$(grep -E '^\s+>' vuln.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      - name: Unit tests
        run: |
          rc=0; dotnet test tests/TenantManager.Domain.Tests -c Release --no-build --logger trx --results-directory TestResults/unit > unit.log 2>&1 || rc=$?
          tail -30 unit.log; python3 .github/scripts/annotate.py trx TestResults/unit || rc=1; exit $rc

      # Uses Testcontainers: starts a real SQL Server in Docker (the runner has Docker).
      - name: Integration tests
        run: |
          rc=0; dotnet test tests/TenantManager.Api.IntegrationTests -c Release --no-build --logger trx --results-directory TestResults/integration > integration.log 2>&1 || rc=$?
          tail -40 integration.log; python3 .github/scripts/annotate.py trx TestResults/integration || rc=1; exit $rc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (includes template accessibility rules)
        run: |
          rc=0; npx ng lint > lint.log 2>&1 || rc=$?
          cat lint.log
          if [ $rc -ne 0 ]; then echo "::error title=Lint failed::$(grep -E 'error|✖' lint.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; fi
          exit $rc
      - name: Component tests
        run: |
          rc=0; npx ng test --watch=false > test.log 2>&1 || rc=$?
          cat test.log
          if [ $rc -ne 0 ]; then echo "::error title=Component tests failed::$(grep -vE '^\s*$' test.log | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; fi
          exit $rc
      - name: Production build
        run: |
          rc=0; npx ng build --configuration production > build.log 2>&1 || rc=$?
          cat build.log
          if [ $rc -ne 0 ]; then echo "::error title=Build failed::$(tail -40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; fi
          exit $rc
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  infra:
    name: Bicep build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Compile and lint the Azure templates (no Azure account needed)
        run: |
          az bicep install > /dev/null
          rc=0; az bicep build --file infra/main.bicep --stdout > main.json 2> bicep.log || rc=$?
          cat bicep.log
          if [ $rc -ne 0 ]; then echo "::error title=Bicep build failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' bicep.log)"; exit $rc; fi
          az bicep lint --file infra/main.bicep 2>&1 | tee lint.log
          if grep -qi "error" lint.log; then echo "::error title=Bicep lint::$(grep -i error lint.log | head -20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; fi
          echo "::notice title=Bicep::$(python3 -c "import json;print(len(json.load(open('main.json'))['resources']),'top-level resources compile')")"

  smoke:
    name: docker compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start the whole stack exactly as a developer would
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SIGNING_KEY=.*/JWT_SIGNING_KEY=$(openssl rand -hex 32)/" .env
          docker compose up -d --build > compose.log 2>&1 || { cat compose.log; exit 1; }
      - name: Sign in through nginx and read the seeded properties
        run: |
          set -a; . ./.env; set +a
          for i in $(seq 1 60); do
            curl -sf http://localhost:4200/api/v1/auth/login -H 'Content-Type: application/json' \
              -d "{\"email\":\"landlord@mastene.test\",\"password\":\"$SEED_PASSWORD\"}" > login.json && break
            sleep 5
          done
          token=$(python3 -c "import json;print(json.load(open('login.json'))['accessToken'])")
          curl -sf http://localhost:4200/api/v1/properties -H "Authorization: Bearer $token" > properties.json
          python3 - <<'PY'
          import json
          data = json.load(open("properties.json"))
          names = sorted(p["name"] for p in data["items"])
          assert names == ["Jacaranda Court", "Marula Gardens"], names
          print(f"::notice title=Smoke test::Signed in as the demo landlord via nginx; saw {names}")
          PY
          # The tenant can download their seeded lease PDF; it was stored in Azurite by the migrator.
          curl -sf http://localhost:4200/api/v1/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"sipho.dlamini@example.com\",\"password\":\"$SEED_PASSWORD\"}" > tenant.json
          ttoken=$(python3 -c "import json;print(json.load(open('tenant.json'))['accessToken'])")
          curl -sf http://localhost:4200/api/v1/leases -H "Authorization: Bearer $ttoken" > leases.json
          lease=$(python3 -c "import json;d=json.load(open('leases.json'));assert d['totalCount']==1,d;print(d['items'][0]['id'])")
          curl -sf http://localhost:4200/api/v1/leases/$lease -H "Authorization: Bearer $ttoken" > lease.json
          doc=$(python3 -c "import json;d=json.load(open('lease.json'));assert d['status']=='Active',d['status'];print(d['documents'][-1]['id'])")
          curl -sf http://localhost:4200/api/v1/leases/$lease/documents/$doc -H "Authorization: Bearer $ttoken" -o lease.pdf
          head -c 5 lease.pdf | grep -q '%PDF-' && echo "::notice title=Smoke test::Tenant downloaded their signed lease PDF ($(stat -c %s lease.pdf) bytes) from Azurite via nginx"
          # Phase 3: the tenant's verified payments have receipts stored in Azurite.
          curl -sf "http://localhost:4200/api/v1/payments?status=Verified&pageSize=1" -H "Authorization: Bearer $ttoken" > payments.json
          pay=$(python3 -c "import json;d=json.load(open('payments.json'));assert d['totalCount']>0,d;print(d['items'][0]['id'])")
          curl -sf http://localhost:4200/api/v1/payments/$pay/receipt -H "Authorization: Bearer $ttoken" -o receipt.pdf
          head -c 5 receipt.pdf | grep -q '%PDF-' && echo "::notice title=Smoke test::Tenant downloaded a rent receipt ($(stat -c %s receipt.pdf) bytes)"
          # Phase 4: the tenant's seeded issue has a photo (a real PNG) stored in Azurite.
          curl -sf "http://localhost:4200/api/v1/issues?pageSize=50" -H "Authorization: Bearer $ttoken" > issues.json
          issue=$(python3 -c "import json;d=json.load(open('issues.json'));print(next(i['id'] for i in d['items'] if i['photoCount']>0))")
          curl -sf http://localhost:4200/api/v1/issues/$issue -H "Authorization: Bearer $ttoken" > issue.json
          photo=$(python3 -c "import json;print(json.load(open('issue.json'))['photos'][0]['id'])")
          curl -sf http://localhost:4200/api/v1/issues/$issue/photos/$photo -H "Authorization: Bearer $ttoken" -o photo.png
          head -c 8 photo.png | od -An -tx1 | grep -q "89 50 4e 47" && echo "::notice title=Smoke test::Tenant viewed an issue photo ($(stat -c %s photo.png) bytes)"
          curl -sf "http://localhost:4200/api/v1/issues?escalated=true" -H "Authorization: Bearer $token" | grep -q "Geyser not heating"
          # Phase 5: the seeded WhatsApp thread, a simulated reply through the signed webhook path,
          # and an unsigned webhook call refused.
          sipho=$(python3 -c "import json;print(json.load(open('tenant.json'))['user']['tenantId'])")
          curl -sf http://localhost:4200/api/v1/dev/whatsapp/inbound -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d "{\"tenantId\":\"$sipho\",\"body\":\"Smoke test reply\"}" > thread.json
          python3 -c "import json;t=json.load(open('thread.json'));assert t['inServiceWindow'] and t['consent']['granted'],t;assert t['messages'][-1]['body']=='Smoke test reply'"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4200/api/v1/webhooks/whatsapp -H 'Content-Type: application/json' -d '{"entry":[]}')
          [ "$code" = "401" ] && echo "::notice title=Smoke test::WhatsApp thread works; unsigned webhook refused ($code)"
          # Phase 6: the refresh token is a cookie (never in the body) and refreshes through nginx;
          # the tenant downloads their own data.
          curl -sf -c jar.txt http://localhost:4200/api/v1/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"sipho.dlamini@example.com\",\"password\":\"$SEED_PASSWORD\"}" > session.json
          python3 -c "import json;d=json.load(open('session.json'));assert 'refreshToken' not in d,d"
          grep -q tm_refresh jar.txt
          curl -sf -b jar.txt -X POST http://localhost:4200/api/v1/auth/refresh -H 'X-Requested-With: TenantManager' > refreshed.json
          curl -sf "http://localhost:4200/api/v1/tenants/$sipho/export" -H "Authorization: Bearer $ttoken" -o export.zip
          python3 -c "import zipfile;z=zipfile.ZipFile('export.zip');assert 'tenant.json' in z.namelist();print('::notice title=Smoke test::Refresh cookie works through nginx; tenant export has',len(z.namelist()),'files')"
          # Security headers on the page itself and on the bundles, not just on API responses.
          curl -sfI http://localhost:4200/ | grep -i "content-security-policy" | grep -q "blob:"
          js=$(curl -sf http://localhost:4200/ | grep -oE 'main-[A-Za-z0-9]+\.js' | head -1)
          curl -sfI "http://localhost:4200/$js" | grep -qi "x-content-type-options: nosniff"
          echo "::notice title=Smoke test::Security headers present on index.html and $js"
          curl -sf http://localhost:4200/ | grep -q "<app-root" && echo "Web app is served"
          curl -sf http://localhost:5080/health/ready && echo " API is ready"
      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 80 > logs.txt 2>&1; cat logs.txt
          echo "::error title=Smoke test failed::$(grep -iE 'error|fail|exception' logs.txt | tail -30 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  images:
    name: Docker images
    needs: [backend, frontend, codeql, infra, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/petermoich/mastene-api:${{ github.sha }}
            ghcr.io/petermoich/mastene-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/petermoich/mastene-web:${{ github.sha }}
            ghcr.io/petermoich/mastene-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
