name: fetch-photo
on:
  push:
    branches: [tooling/fetch-login-photo]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the Unsplash photo and make web-sized copies
        run: |
          set -e
          curl -fsSL -o photo.jpg "https://images.unsplash.com/photo-1760894492960-5b0a2da0676d?fm=jpg&q=85&w=2400&ixlib=rb-4.1.0"
          identify photo.jpg
          mkdir -p web/public/images
          convert photo.jpg -auto-orient -strip -resize '2000x2000>' -quality 72 -interlace Plane web/public/images/login-bg.jpg
          convert photo.jpg -auto-orient -strip -resize '2000x2000>' -quality 68 web/public/images/login-bg.webp
          ls -la web/public/images
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add web/public/images
          git commit -m "Add login background photo (Cristian Pineda, Unsplash License)"
          git push
