name: fetch-photo
on:
  push:
    branches: [tooling/fetch-login-photo]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the Unsplash photo and make web-sized copies
        run: |
          set -e
          mkdir -p web/public/images
          base="https://images.unsplash.com/photo-1760894492960-5b0a2da0676d?ixlib=rb-4.1.0&w=2000&fit=max"
          curl -fsSL -o web/public/images/login-bg.jpg "$base&fm=jpg&q=72"
          curl -fsSL -o web/public/images/login-bg.webp "$base&fm=webp&q=68"
          file web/public/images/*
          ls -la web/public/images
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add web/public/images
          git commit -m "Add login background photo (Cristian Pineda, Unsplash License)"
          git push
